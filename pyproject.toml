[project]
name = "condo-agent"
version = "1.0.0"
description = "Condo Agent - Autonomous Condominium Emergency Triage, Auto-Dispatch & Hybrid Graph RAG Platform."
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-genai>=2.30.1",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=22.8",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
